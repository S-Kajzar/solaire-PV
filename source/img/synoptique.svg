    <text x="130" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="#7EE2B8">MPPT</text>
    <text x="130" y="332" text-anchor="middle" font-size="9" fill="#7EE2B8">24 V</text>
    <circle cx="176" cy="314" r="4" fill="#7EE2B8"/><circle cx="192" cy="314" r="4" fill="#F2B705"/>
    <rect x="170" y="326" width="28" height="9" rx="2" fill="#E6EEF8"/>
