    <g stroke="#C62828">
      <path d="M150 182V244" marker-end="url(#ae)"/>
      <path d="M150 382V464" marker-end="url(#ae)"/>
      <path d="M150 425H304" marker-end="url(#ae)"/>
      <path d="M490 155H600V264" marker-end="url(#ae)"/>
      <path d="M490 400H524" marker-end="url(#ae)"/>
      <path d="M680 355H714" marker-end="url(#ae)"/>
    </g>
    <!-- eau -->
    <g stroke="#1F8FD0">
      <path d="M795 498V426" marker-end="url(#aw)"/>
      <path d="M795 288V252H902V226" marker-end="url(#aw)"/>
      <path d="M850 128H864" marker-end="url(#aw)"/>
      <path d="M962 222V494" marker-end="url(#aw)"/>
    </g>
    <!-- commande -->
    <path d="M852 498V472H932V228" stroke="#B26A00" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ac)"/>
  </g>
  <text x="0" y="0" transform="translate(924 352) rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B26A00">Commande vanne 3 voies</text>

  <!-- ===================== CARTES ===================== -->
  <g stroke="#1C2530" stroke-width="2" fill="#FFFFFF">
    <rect x="40" y="30" width="220" height="152"/>
    <rect x="40" y="250" width="220" height="132"/>
    <rect x="40" y="470" width="220" height="180"/>
    <rect x="310" y="80" width="180" height="150"/>
    <rect x="310" y="330" width="180" height="190"/>
    <rect x="530" y="270" width="150" height="160"/>
    <rect x="720" y="290" width="150" height="136"/>
    <rect x="720" y="40" width="130" height="170"/>
    <rect x="870" y="70" width="120" height="152"/>
    <rect x="720" y="504" width="150" height="146"/>
    <rect x="880" y="500" width="110" height="150"/>
  </g>
  <g fill="#1C2530">
    <rect x="40" y="30" width="220" height="26"/>
    <rect x="40" y="250" width="220" height="26"/>
    <rect x="40" y="470" width="220" height="26"/>
    <rect x="310" y="80" width="180" height="26"/>
    <rect x="310" y="330" width="180" height="26"/>
    <rect x="530" y="270" width="150" height="26"/>
    <rect x="720" y="290" width="150" height="26"/>
    <rect x="720" y="40" width="130" height="26"/>
    <rect x="870" y="70" width="120" height="26"/>
    <rect x="720" y="504" width="150" height="26"/>
    <rect x="880" y="500" width="110" height="26"/>
