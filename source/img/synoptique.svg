    <circle cx="370" cy="446" r="4" fill="#1B7A43"/><circle cx="384" cy="446" r="4" fill="#F2B705"/><circle cx="398" cy="446" r="4" fill="#D3D8D5"/>
    <g stroke="#B9C1C7" stroke-width="3"><path d="M362 462H438M362 470H438M362 478H438M362 486H438"/></g>
