    <g fill="#46525C"><rect x="558" y="318" width="8" height="8"/><rect x="570" y="318" width="8" height="8"/><rect x="582" y="318" width="8" height="8"/><rect x="620" y="318" width="8" height="8"/><rect x="632" y="318" width="8" height="8"/><rect x="644" y="318" width="8" height="8"/></g>
    <circle cx="605" cy="372" r="18" fill="#1C2530"/>
    <rect x="602" y="356" width="6" height="18" rx="2" fill="#F2B705" transform="rotate(-40 605 372)"/>
    <text x="582" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#1C2530">I</text>
    <text x="605" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#1C2530">0</text>
    <text x="630" y="402" text-anchor="middle" font-size="11" font-weight="700" fill="#1C2530">II</text>
  </g>

