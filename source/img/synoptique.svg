  <!-- ===================== LÉGENDE ===================== -->
  <g font-size="13" fill="#1C2530">
    <rect x="310" y="562" width="380" height="72" fill="#F4F5F2" stroke="#D3D8D5"/>
    <text x="324" y="584" font-weight="700">LÉGENDE</text>
    <path d="M324 606H362" stroke="#C62828" stroke-width="3.2" marker-end="url(#ae)"/><text x="372" y="610">Énergie électrique</text>
    <path d="M512 606H550" stroke="#1F8FD0" stroke-width="3.2" marker-end="url(#aw)"/><text x="560" y="610">Eau</text>
    <path d="M324 624H362" stroke="#B26A00" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#ac)"/><text x="372" y="628">Commande (niveau de la cuve)</text>
