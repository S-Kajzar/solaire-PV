    <rect x="884" y="155" width="14" height="16" fill="#B9C1C7"/><rect x="962" y="155" width="14" height="16" fill="#B9C1C7"/>
    <text x="908" y="196" text-anchor="end" font-size="9" fill="#46525C">A</text>
    <text x="952" y="196" font-size="9" fill="#46525C">B</text>
  </g>

  <!-- Cuve d'eau pluviale enterrée -->
