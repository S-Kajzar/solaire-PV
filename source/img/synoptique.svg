<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" font-family="Bahnschrift,'DIN Alternate','Roboto Condensed','Arial Narrow',sans-serif">
  <defs>
    <pattern id="cells" width="10.3" height="10" patternUnits="userSpaceOnUse">
      <rect width="10.3" height="10" fill="#18212E"/>
      <path d="M0 0H10.3M0 0V10" stroke="#3B4C63" stroke-width="0.8"/>
    </pattern>
    <marker id="ae" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#C62828"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1F8FD0"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#B26A00"/>
    </marker>
    <linearGradient id="inox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDF0"/><stop offset=".5" stop-color="#BFC8CF"/><stop offset="1" stop-color="#8E99A3"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEBF7"/><stop offset="1" stop-color="#FFFFFF"/>
