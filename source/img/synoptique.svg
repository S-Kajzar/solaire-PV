    <text x="150" y="268">RÉGULATEUR</text>
    <text x="150" y="488">BATTERIES 24 V</text>
    <text x="400" y="98">RÉSEAU EDF 230 V</text>
    <text x="400" y="348">ONDULEUR 230 V</text>
    <text x="605" y="288" font-size="12.5">INVERSEUR SOURCE</text>
    <text x="795" y="308">POMPE</text>
    <text x="785" y="58">EAU DE VILLE</text>
    <text x="930" y="88">VANNE 3 VOIES</text>
    <text x="795" y="522" font-size="12.5">CUVE EAU PLUVIALE</text>
    <text x="935" y="518">TOILETTES</text>
  </g>

